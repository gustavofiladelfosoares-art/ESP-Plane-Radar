; ESP Plane Radar — ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"
;
;   supermini      original ESP32-Plane-Radar wiring (display DC on GPIO10)
;   supermini-dc2  units wired with display DC on GPIO2
;   screentest     wiring finder for a black screen (test_screen/)

[env]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Smooth VLW fonts: the original radar font (Noto Sans Bold 15) plus Latin-1
; Noto Sans Bold sizes generated by scripts/make_vlw.py for the extra pages.
board_build.embed_files =
  data/ui_font.vlw
  data/fonts/noto_bold_14.vlw
  data/fonts/noto_bold_17.vlw
  data/fonts/noto_bold_22.vlw
  data/fonts/noto_bold_28.vlw
  data/fonts/noto_bold_54_digits.vlw

; USB serial over USB-C (Super Mini native USB)
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -I include
  -DWM_STRINGS_FILE="\"wm_strings_pt.h\""

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]

[env:supermini-dc2]
build_flags =
  ${env.build_flags}
  -DPR_DISPLAY_PIN_DC=2

; Screen wiring finder (test_screen/screen_test.cpp) — flash it when the display
; stays black to find which pins the screen is actually wired to.
[env:screentest]
build_src_filter = -<*> +<../test_screen/>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
